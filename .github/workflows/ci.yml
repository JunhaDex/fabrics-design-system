name: CI

# PR 에서만 돈다. main 은 green 한 PR 의 squash merge 결과이므로
# push 트리거를 두지 않아 중복 실행을 피한다.
on: pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Storybook Vitest addon 이 브라우저 모드로 실행된다.
      - run: pnpm --filter fabrics-storybook exec playwright install chromium --with-deps

      # lint 는 빌드가 필요 없으므로 먼저 돌려 일찍 실패시킨다.
      - run: pnpm lint

      # format:check 보다 먼저 빌드해야 한다. prettier-plugin-tailwindcss 가
      # tailwindStylesheet 를 따라가다 `@junhadex/theme-neutral/theme.css` 를
      # 만나는데, 이 파일은 토큰 빌드가 만드는 산출물이라 깨끗한 체크아웃에는 없다.
      - run: pnpm build

      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
