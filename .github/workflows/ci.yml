name: CI

# PR 에서만 돈다. main 은 green 한 PR 의 squash merge 결과이므로
# push 트리거를 두지 않아 중복 실행을 피한다.
on: pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Storybook Vitest addon 이 브라우저 모드로 실행된다.
      - run: pnpm --filter fabrics-storybook exec playwright install chromium --with-deps

      # 빠른 것부터 실행해 일찍 실패시킨다.
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
